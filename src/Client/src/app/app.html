<main class="min-h-screen bg-slate-100 text-slate-950">
  @if (!isAuthenticated) {
    <app-auth-page
      [initialErrorMessage]="authErrorMessage"
      (authenticated)="handleAuthenticated($event)"
    />
  }

  @if (isAuthenticated) {
    <app-workspace-page
      [token]="token"
      [currentEmail]="currentEmail"
      (loggedOut)="handleLogout($event)"
    />
  }
</main>

<router-outlet />
